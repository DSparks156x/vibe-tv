# Builds both apps and publishes them as a GitHub release.
# Runs on tags like v0.2.0 (creates the release) or by hand from the Actions tab (artifacts only).
#
# Repo secrets (Settings > Secrets and variables > Actions):
#   VIBE_KEYSTORE_BASE64     base64 of the .jks that signs BOTH apps (they must share a key)
#   VIBE_KEYSTORE_PASSWORD   keystore password
#   VIBE_KEY_ALIAS           key alias
#   VIBE_KEY_PASSWORD        key password
#   TMDB_API_KEY, TRAKT_CLIENT_ID, TRAKT_CLIENT_SECRET (only for older Trakt apps), SIMKL_CLIENT_ID,
#   MDBLIST_CLIENT_ID, PREMIUMIZE_CLIENT_ID    optional app keys baked into Nuvio
# Without the keystore secrets the build still runs, signed with a throwaway debug key.
#
# The two apps build in parallel. Gradle dependencies and task outputs are cached between runs
# (setup-gradle + --build-cache), so unchanged code isn't recompiled.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: "29.0.14206865"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - app: launcher
            task: assembleRelease
          - app: nuvio
            task: assembleFullRelease
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Tag runs aren't on the default branch, so by default they'd only read the cache.
          cache-read-only: false

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          pkgs=("platforms;android-36" "build-tools;36.1.0")
          [ "${{ matrix.app }}" = nuvio ] && pkgs+=("ndk;$NDK_VERSION" "cmake;3.22.1")
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "${pkgs[@]}" > /dev/null

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VIBE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VIBE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VIBE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VIBE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No VIBE_KEYSTORE_BASE64 secret; signing with a throwaway debug key."
            exit 0
          fi
          ks="$RUNNER_TEMP/vibe.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
          {
            echo "storeFile=$ks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing.properties"
          {
            echo "VIBE_SIGNING_PROPERTIES=$RUNNER_TEMP/signing.properties"
            echo "NUVIO_RELEASE_STORE_FILE=$ks"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Nuvio app keys
        if: matrix.app == 'nuvio'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
        run: |
          {
            for k in TMDB_API_KEY TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET SIMKL_CLIENT_ID MDBLIST_CLIENT_ID PREMIUMIZE_CLIENT_ID; do
              echo "$k=${!k}"
            done
          } > nuvio/local.properties

      - name: Build
        working-directory: ${{ matrix.app }}
        env:
          VIBE_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}
        run: chmod +x gradlew && ./gradlew --build-cache ${{ matrix.task }}

      - name: Collect APKs
        run: |
          mkdir -p dist
          if [ "${{ matrix.app }}" = launcher ]; then
            cp launcher/app/build/outputs/apk/release/app-release.apk dist/vibe-launcher.apk
          else
            for f in nuvio/app/build/outputs/apk/full/release/*.apk; do
              abi=$(basename "$f" .apk | grep -oE 'armeabi-v7a|arm64-v8a|x86_64|x86|universal' || echo all)
              cp "$f" "dist/vibe-nuvio-$abi.apk"
            done
          fi
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: apks-${{ matrix.app }}
          path: dist/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: apks-*
          merge-multiple: true
          path: dist

      - run: ls -la dist

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk --repo "$GITHUB_REPOSITORY" \
            --title "Vibe TV $GITHUB_REF_NAME" --generate-notes
